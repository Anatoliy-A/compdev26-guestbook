name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: guestbook:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: guestbook:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Record digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          echo "$image"
          {
            echo "### Published image"
            echo
            echo "\`${image}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  propose-deployment:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GITOPS_REPO: ${{ github.repository_owner }}/compdev26-gitops
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check inputs
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret GITOPS_PR_TOKEN is not set"
            exit 1
          fi
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Image digest is missing or malformed"
            exit 1
          fi

      - name: Open GitOps pull request
        run: |
          set -euo pipefail
          branch="deploy/guestbook-${DIGEST:7:12}"
          file=environments/lab/guestbook/kustomization.yaml

          if [ -n "$(gh pr list --repo "$GITOPS_REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open"
            exit 0
          fi

          gh repo clone "$GITOPS_REPO" gitops -- --depth 1
          cd gitops
          gh auth setup-git

          grep -q 'digest: sha256:' "$file"
          if grep -q "$DIGEST" "$file"; then
            echo "The lab overlay already uses $DIGEST"
            exit 0
          fi

          git switch -c "$branch"
          sed -i -E "s|(digest: )sha256:[a-f0-9]{64}|\1${DIGEST}|" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy guestbook ${DIGEST:0:19}"
          git push --force origin "$branch"

          gh pr create --repo "$GITOPS_REPO" --base main --head "$branch" \
            --title "Deploy guestbook ${DIGEST:0:19}" \
            --body "Updates the lab overlay to \`${DIGEST}\`.

          Source commit: ${SOURCE_SHA}
          Build: ${RUN_URL}

          Merging this pull request lets Argo CD roll the new image out."
